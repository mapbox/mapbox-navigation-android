// No buildscript { } block here on purpose. The versions plugin is already on the
// root project's buildscript classpath, which this script plugin inherits.
// Re-declaring it forced a second, redundant dependency resolution: `apply from:`
// scripts get their own isolated ScriptHandler, so it also ignored any centrally
// configured repositories and went straight to Maven Central.

apply plugin: "com.github.ben-manes.versions"

// disallow release candidates as upgradable versions
dependencyUpdates.resolutionStrategy {
    componentSelection { rules ->
        rules.all { ComponentSelection selection ->
            boolean rejected = ['alpha', 'beta', 'rc', 'cr', 'm'].any { qualifier ->
                selection.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
            }
            if (rejected) {
                selection.reject('Release candidate')
            }
        }
    }
}