// No buildscript { } block here on purpose. pluginDependencies.dependencyGraph is
// declared on the root project's buildscript classpath, which this script plugin
// inherits. Declaring it here instead forced a second, redundant dependency
// resolution: `apply from:` scripts get their own isolated ScriptHandler, so it also
// ignored any centrally configured repositories and went straight to Maven Central.

import com.vanniktech.dependency.graph.generator.DependencyGraphGeneratorPlugin
import com.vanniktech.dependency.graph.generator.DependencyGraphGeneratorExtension.Generator

plugins.apply(DependencyGraphGeneratorPlugin)

def mapboxGenerator = new Generator(
        "mapboxLibraries", // Suffix for our Gradle task.
        { dependency -> dependency.getModuleGroup().startsWith("com.mapbox") }, // Only want Mapbox libs.
        { dependency -> true }, // Include transitive dependencies.
)

dependencyGraphGenerator {
    generators {
        add(mapboxGenerator)
    }
}