  <!-- Footer note -->
  <text x="50" y="810" style="fill: #868e96; font-size: 10px; font-style: italic;">
    Module names before the semicolon are in-scope libraries (com.mapbox.navigationcore:name is public-tree module name;
  </text>
  <text x="50" y="826" style="fill: #868e96; font-size: 10px; font-style: italic;">
    project(':x') is internal module x). Bound SDKs after the semicolon are declared directly by that module.
  </text>
  <text x="50" y="842" style="fill: #868e96; font-size: 10px; font-style: italic;">
    Mapbox Java SDK sub-artifacts, AndroidX, Kotlin and test dependencies are omitted. "compose-" is short for "libnavigation-compose-".
  </text>
