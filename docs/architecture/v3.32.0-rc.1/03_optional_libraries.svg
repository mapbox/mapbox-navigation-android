<svg viewBox="0 0 1050 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header-row { fill: #FFF3E0; stroke: #F57C00; stroke-width: 1.5; }
      .row-even { fill: #fdfdfd; stroke: #dee2e6; stroke-width: 1; }
      .row-odd { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
      .header-text { fill: #212529; font-size: 12px; font-weight: 700; }
      .module-name { fill: #212529; font-size: 11px; font-weight: 600; font-family: monospace; }
      .cell-text { fill: #495057; font-size: 10px; }
    </style>
  </defs>

  <text x="525" y="30" text-anchor="middle" style="fill: #212529; font-size: 20px; font-weight: 700;">
    Navigation SDK for Android - Optional Libraries (3.32.0-rc.1)
  </text>
  <text x="525" y="52" text-anchor="middle" style="fill: #868e96; font-size: 11px; font-style: italic;">
    Consumed selectively per integrator. "Depends on" is read from each module's build.gradle at this commit.
  </text>

